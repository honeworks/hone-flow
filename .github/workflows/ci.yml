name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: { python-version: "${{ matrix.python }}", enable-cache: true }
      # Every hone-flow extra is light (typer, fsspec/s3fs, psutil, nvidia-ml-py); no torch or CUDA.
      # The dev dependency group is installed by default.
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Default suite only: pyproject's addopts deselect the gpu / ollama / comfyui / hosted markers.
      - run: uv run pytest --cov --cov-fail-under=90
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - name: Smoke test the wheel in a clean env
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "import hone_flow; print(hone_flow.__version__)"
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/examples/quickstart.py"
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }
